# CI for OJS 3.5. It runs once per pull request and not on every push: one run per change is
# enough, and every run installs a full OJS in four PHP/database combinations.
# (`pkp plugin ci` would restore the push trigger of the shared template.)
on:
  pull_request:
name: CI (OJS 3.5)
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: ojs
            php-version: 8.2
            database: mysql
          - application: ojs
            php-version: 8.3
            database: mysql
          - application: ojs
            php-version: 8.2
            database: pgsql
          - application: ojs
            php-version: 8.3
            database: pgsql
    steps:
      - uses: pkp/pkp-github-actions@v1
        with:
          node_version: 20
          branch: stable-3_5_0
          repository: pkp
          plugin: true
          dataset_inject: true
